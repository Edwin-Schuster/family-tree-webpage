<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Tree</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
  <div class="tree-page">
    <header class="site-header">
      <div class="brand">
        <h1 id="title">Family Tree</h1>
        <p class="stats" id="stats"></p>
      </div>
      <div class="toolbar">
        <div class="find">
          <input id="search" type="search" placeholder="Find a person…" aria-label="Find a person" autocomplete="off">
          <ul id="search-results" class="find-results" hidden></ul>
        </div>
        <a class="button" href="/admin">Edit</a>
      </div>
      <nav class="view-tabs" id="tabs" aria-label="Views"></nav>
    </header>
    <div class="tree-layout">
      <main class="tree-main">
        <div class="view-bar" id="view-bar"></div>
        <div class="tree-viewport" id="viewport">
          <div id="view" aria-live="polite"></div>
        </div>
      </main>
      <aside class="details" id="details" hidden aria-label="Person details"></aside>
    </div>
  </div>
  <script src="/common.js"></script>
  <script src="/tree.js"></script>
</body>
</html>
